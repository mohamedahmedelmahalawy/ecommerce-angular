<nav class="bg-neutral-primary sticky w-full z-20 top-0 start-0 border-b border-default">
  <div class="max-w-7xl flex flex-wrap items-center justify-between mx-auto p-4">
    <div class="flex flex-col sm:flex-row items-center">
      <a routerLink="/home" class="flex items-center space-x-3 rtl:space-x-reverse">
        <img
          src="/assets/images/FreshCart_Logo.png"
          class="w-28 h-9 lg:w-36 lg:h-11 object-contain mr-4"
          alt="FreshCart Logo"
        />
      </a>

      @if (isLoggedIn) {
        <ul class="flex flex-wrap justify-center gap-x-4 gap-y-2">
          <li>
            <a
              routerLink="/home"
              routerLinkActive="text-green-800 font-extrabold"
              class="font-semibold"
              >Home</a
            >
          </li>
          <li>
            <a
              routerLink="/cart"
              routerLinkActive="text-green-800 font-extrabold"
              class="font-semibold"
              >Cart</a
            >
          </li>
          <li>
            <a
              routerLink="/products"
              routerLinkActive="text-green-800 font-extrabold"
              class="font-semibold"
              >Products</a
            >
          </li>
          <li>
            <a
              routerLink="/brands"
              routerLinkActive="text-green-800 font-extrabold"
              class="font-semibold"
              >Brands</a
            >
          </li>
        </ul>
      }
    </div>

    <button
      data-collapse-toggle="navbar-default"
      type="button"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base lg:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary"
      aria-controls="navbar-default"
      aria-expanded="false"
    >
      <span class="sr-only">Open main menu</span>
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-width="2"
          d="M5 7h14M5 12h14M5 17h14"
        />
      </svg>
    </button>

    <div class="hidden w-full lg:block lg:w-auto" id="navbar-default">
      <ul class="flex flex-col lg:flex-row lg:items-center gap-4 p-4 lg:p-0">
        <li class="flex gap-3">
          <i class="fa-brands fa-facebook"></i>
          <i class="fa-brands fa-twitter"></i>
          <i class="fa-brands fa-instagram"></i>
          <i class="fa-brands fa-youtube"></i>
          <i class="fa-brands fa-linkedin"></i>
        </li>

        @if (isLoggedIn) {
          <li>
            <button class="font-semibold" (click)="logOut()">SignOut</button>
          </li>
        } @else {
          <li>
            <a
              routerLink="/login"
              routerLinkActive="text-green-800 font-extrabold"
              class="font-semibold"
              >Login</a
            >
          </li>
          <li>
            <a
              routerLink="/register"
              routerLinkActive="text-green-800 font-extrabold"
              class="font-semibold"
              >Register</a
            >
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
